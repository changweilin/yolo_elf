name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is the development platform and the only one the PowerShell
    # scripts target; Linux proves the app itself has no platform assumptions
    # (path separators, SQLite paths, the static build).
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.ultralytics

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install check dependencies
        run: python -m pip install -r requirements-ci.txt

      # The checks never install ultralytics/torch, so nothing else proves the
      # full runtime set still resolves. Metadata-only, no multi-GB downloads.
      - name: Resolve full runtime dependencies
        run: python -m pip install --dry-run --quiet -r requirements.txt

      # Lint, pytest, py_compile and node --check, identically on both runners.
      - name: Run checks
        run: npm test
        env:
          YOLO_ELF_PYTHON: python

      - name: Build static web demo
        run: npm run build:github-pages

      - name: Check the demo build produced a page
        shell: bash
        run: test -s dist/index.html

  pages:
    name: GitHub Pages
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build static web demo
        run: npm run build:github-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
