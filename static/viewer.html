<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YOLO Elf Viewer</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/app.css?v=ui-10" />
  </head>
  <body>
    <main class="viewer-shell">
      <!-- One pane per camera. With a single camera the stage renders exactly
           one full-bleed pane, which is the original single-stream layout. -->
      <section class="viewer-stage" id="viewerStage" data-count="1" aria-label="detected stream">
        <div class="viewer-pane" id="viewerPanePrimary">
          <img id="viewerImage" class="pane-image" alt="Detection preview" />
          <canvas id="viewerOverlay" class="pane-overlay"></canvas>
          <div id="emptyState" class="empty-state">Waiting for frames</div>
          <span class="pane-label" hidden></span>
        </div>
      </section>

      <!-- VLM scene caption. Shown only on the VLM channel; text comes from the
           active camera's latest `vlm` payload (description). -->
      <div id="vlmCaption" class="vlm-caption" hidden></div>

      <header class="hud topbar">
        <div class="brand"><img src="/static/logo.svg" alt="YOLO Elf" /></div>
        <nav class="role-switch" aria-label="Mode">
          <a href="/recorder" aria-label="Recorder" title="Recorder">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </a>
          <a href="/viewer" aria-current="page" aria-label="Viewer" title="Viewer">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </a>
          <a href="/settings" aria-label="Settings" title="Settings">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </a>
          <a href="/history" aria-label="History" title="History">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </a>
        </nav>
        <div class="topbar-actions">
          <div class="status-row">
            <span id="viewerSocketStatus" class="chip warn">viewer idle</span>
            <span id="cameraLinkStatus" class="chip warn">phone idle</span>
            <span id="phoneStorageStatus" class="chip warn">phone storage idle</span>
            <span id="modelStatus" class="chip warn">model idle</span>
            <span id="storageStatus" class="chip warn">storage idle</span>
            <span id="alertStatus" class="chip warn">alerts off</span>
          </div>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <svg class="theme-icon theme-icon-sun" data-theme-icon-sun aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg class="theme-icon theme-icon-moon" data-theme-icon-moon aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M12 3a6 6 0 0 0 9 7.4A9 9 0 1 1 12 3Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <aside class="viewer-panel" id="viewerPanel">
        <div class="panel-header">
          <span class="panel-title">Stream metrics</span>
          <div class="panel-header-actions">
            <a href="/recorder" target="_blank" rel="noreferrer">
              <button type="button">Open recorder</button>
            </a>
            <!-- The panel is taller than a phone viewport, so it collapses to
                 just this header; on narrow screens it starts collapsed. -->
            <button
              id="panelToggle"
              class="icon-button panel-toggle"
              type="button"
              aria-controls="viewerPanelBody"
              aria-expanded="true"
              aria-label="收合面板"
              title="收合面板"
            >
              <svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="m6 15 6-6 6 6"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="panel-body" id="viewerPanelBody">
        <!-- Server-side head switch: unlike the YOLO/VLM channel toggle this
             changes what the single detection worker runs, for every viewer.
             Split into two tabs by what the head draws, because that is what
             decides whether two heads can be shown at the same time:
               · 物件疊加 — per-instance boxes/masks/skeletons that composite
                 freely, so these are checkboxes and any mix may run at once.
               · 整張畫面 — full-frame rasters; each repaints every pixel, so
                 picking one clears the other.
             Only the chips of the open tab are on screen, which is what keeps
             the row readable now that there are seven of them. -->
        <div class="panel-control panel-control-stacked task-control">
          <div class="task-tabs" role="tablist" aria-label="任務類別">
            <button
              type="button"
              role="tab"
              id="taskTabBox"
              data-task-tab="box"
              aria-selected="true"
              aria-controls="taskPanelBox"
            >
              物件疊加
            </button>
            <button
              type="button"
              role="tab"
              id="taskTabRaster"
              data-task-tab="raster"
              aria-selected="false"
              aria-controls="taskPanelRaster"
            >
              整張畫面
            </button>
          </div>
          <div id="taskPanelBox" class="task-chips" role="tabpanel" aria-labelledby="taskTabBox">
            <button type="button" class="task-chip" data-detect-task="detect" aria-pressed="true" title="物件偵測：方框 + 追蹤 + 區域 / 告警 / 歷史">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="11" height="9" rx="1"></rect>
                <rect x="11" y="11" width="10" height="8" rx="1"></rect>
              </svg>
              物件
            </button>
            <button type="button" class="task-chip" data-detect-task="segment" aria-pressed="false" title="實例分割：每個物件的輪廓多邊形">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 14c1-6 6-9 10-8s6 5 5 9-5 7-9 6-7-3-6-7z"></path>
                <path d="M8 13c.5-2.5 2.5-4 4.5-3.5"></path>
              </svg>
              分割
            </button>
            <button type="button" class="task-chip" data-detect-task="pose" aria-pressed="false" title="姿態估計：人體骨架關鍵點">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="4" r="2"></circle>
                <path d="M12 6v7M12 8l-4 3M12 8l4 3M12 13l-3 7M12 13l3 7"></path>
              </svg>
              姿態
            </button>
            <button type="button" class="task-chip" data-detect-task="obb" aria-pressed="false" title="旋轉框：可傾斜的方框（空拍 / 遙測常用）">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="5" y="7" width="14" height="10" rx="1" transform="rotate(-20 12 12)"></rect>
              </svg>
              旋轉框
            </button>
            <button type="button" class="task-chip" data-detect-task="openvocab" aria-pressed="false" title="開放詞彙（YOLOE-26）：用「開放詞彙類別」文字提示自訂要找什麼">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M20 20l-4.5-4.5M9 11h4M11 9v4"></path>
              </svg>
              開放詞彙
            </button>
          </div>
          <div id="taskPanelRaster" class="task-chips" role="tabpanel" aria-labelledby="taskTabRaster" hidden>
            <button type="button" class="task-chip" data-detect-task="semantic" aria-pressed="false" title="語意分割：整張畫面逐像素分類（無方框）">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 4h8v7H3zM11 4h10v7H11zM3 11h6v9H3zM9 11h12v9H9z"></path>
              </svg>
              語意
            </button>
            <button type="button" class="task-chip" data-detect-task="depth" aria-pressed="false" title="單目深度估計：逐像素距離（亮＝近，無方框）">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 20l9-16 9 16z"></path>
                <path d="M7.5 12h9M9.7 16h4.6"></path>
              </svg>
              深度
            </button>
          </div>
          <p id="taskHint" class="settings-hint"></p>
        </div>
        <div class="panel-control">
          <span class="panel-control-label">辨識模式</span>
          <div id="modeGroup" class="segmented-control detect-mode" role="group" aria-label="辨識模式">
            <button type="button" data-detect-mode="fast" aria-pressed="true" title="快速辨識（較小模型，速度優先）">快速</button>
            <button type="button" data-detect-mode="accurate" aria-pressed="false" title="精準辨識（較大模型，準確優先）">精準</button>
          </div>
        </div>
        <!-- Class swatches (semantic) or the metre range (depth). Empty and
             hidden for the box tasks, which label themselves on the canvas. -->
        <div id="rasterLegend" class="raster-legend" hidden></div>
        <div id="channelGroupControl" class="panel-control" hidden>
          <span class="panel-control-label">通道</span>
          <div id="channelGroup" class="segmented-control" role="group" aria-label="偵測通道">
            <button type="button" data-channel="yolo" aria-pressed="true" title="YOLO：精準框、追蹤、歷史">YOLO</button>
            <button type="button" data-channel="vlm" aria-pressed="false" title="VLM：開放詞彙框、場景描述（較慢）">VLM</button>
          </div>
        </div>
        <div id="modelSwitchProgress" class="switch-progress" role="status" aria-live="polite">
          <span class="switch-label">切換模型中…</span>
          <div class="progress-track"><div id="modelSwitchFill" class="progress-fill"></div></div>
        </div>
        <div class="metric-grid">
          <div class="metric">
            <div class="metric-label">Frame</div>
            <div id="frameMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Boxes</div>
            <div id="boxesMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Inference</div>
            <div id="inferenceMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Dropped</div>
            <div id="droppedMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Recordings</div>
            <div id="recordingMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Remote uploads</div>
            <div id="uploadMetric" class="metric-value">-</div>
          </div>
        </div>
        <div id="cameraBar" class="panel-control camera-bar" hidden>
          <span class="panel-control-label">相機</span>
          <div id="cameraTabs" class="filter-chips"></div>
        </div>
        <!-- Box-only controls: hidden while no box head runs, since a class
             filter and an ROI both act on boxes that would not exist. -->
        <div id="viewFilterControl" class="panel-control view-filter">
          <div class="view-filter-head">
            <span class="panel-control-label">顯示過濾</span>
            <button id="saveFrameButton" type="button" class="compact-button">存圖</button>
          </div>
          <div id="classFilterList" class="filter-chips"></div>
          <label class="filter-conf">
            <span class="panel-control-label">最低信心</span>
            <input id="viewerMinConf" type="range" min="0" max="0.95" step="0.05" value="0" />
            <output id="viewerMinConfValue" class="filter-conf-value">0%</output>
          </label>
          <p id="saveFrameHint" class="settings-hint" hidden></p>
        </div>
        <div id="zoneEditorControl" class="panel-control zone-editor">
          <div class="zone-editor-head">
            <span class="panel-control-label">ROI 區域</span>
            <button id="zoneEditToggle" type="button" class="compact-button">編輯</button>
          </div>
          <div id="zoneDraftBar" class="zone-draft" hidden>
            <span id="zoneDraftHint" class="settings-hint">點擊畫面加入頂點（至少 3 點）</span>
            <div class="zone-draft-actions">
              <button id="zoneFinishButton" type="button" class="compact-button">完成</button>
              <button id="zoneUndoButton" type="button" class="compact-button">退一步</button>
              <button id="zoneClearButton" type="button" class="compact-button">清除</button>
            </div>
          </div>
          <ul id="zoneList" class="zone-list"></ul>
        </div>
        <div id="errorLine" class="error-line" hidden></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/static/viewer.js?v=multitask-1"></script>
  </body>
</html>
