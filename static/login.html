<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YOLO Elf · 登入</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/app.css?v=ui-5" />
    <style>
      body.login-page {
        overflow: auto;
      }
      .login-shell {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .login-card {
        width: min(360px, 100%);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-strong);
        box-shadow: 0 18px 42px var(--shadow);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .login-card img {
        height: 30px;
        width: auto;
      }
      .login-title {
        font-weight: 700;
        font-size: 18px;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .login-form input {
        width: 100%;
        min-height: 40px;
        box-sizing: border-box;
      }
      .login-form button {
        width: 100%;
      }
      .login-error {
        color: var(--bad);
        font-size: 13px;
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="login-card">
        <img src="/static/logo.svg" alt="YOLO Elf" />
        <div class="login-title">需要登入</div>
        <p class="settings-hint">輸入伺服器設定的存取權杖（<code>AUTH_TOKEN</code>）以繼續。</p>
        <form id="loginForm" class="login-form" autocomplete="off">
          <input
            id="tokenInput"
            type="password"
            name="token"
            inputmode="text"
            autocomplete="current-password"
            placeholder="存取權杖"
            aria-label="存取權杖"
            required
          />
          <button id="loginButton" type="submit" class="primary">登入</button>
          <div id="loginError" class="login-error" hidden></div>
        </form>
      </div>
    </main>
    <script>
      (() => {
        const form = document.querySelector("#loginForm");
        const input = document.querySelector("#tokenInput");
        const button = document.querySelector("#loginButton");
        const errorLine = document.querySelector("#loginError");

        // Only local paths, never a scheme/host, to avoid an open redirect.
        function safeNext() {
          const raw = new URLSearchParams(window.location.search).get("next") || "/";
          return raw.startsWith("/") && !raw.startsWith("//") ? raw : "/";
        }

        function showError(message) {
          errorLine.textContent = message;
          errorLine.hidden = !message;
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const token = input.value;
          if (!token) {
            return;
          }
          button.disabled = true;
          showError("");
          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ token }),
            });
            if (response.ok) {
              window.location.replace(safeNext());
              return;
            }
            showError(response.status === 401 ? "權杖不正確" : "登入失敗，請再試一次");
          } catch {
            showError("無法連線到伺服器");
          } finally {
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
